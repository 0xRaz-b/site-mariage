      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // local text and treats a miss as authoritative — never relaying to

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's

      // as real-vs-'null' rather than matching.

    // degraded state as a refused embed.
    {

      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);

"margin:0\">Nous avons donc imaginé cette fin de semaine dans un lieu qui nous a fait sentir comme à la maison. Nous souhaitons que ce moment soit remplie de moments simples et mémorables, de conversations qui s'étirent, de fous rires, de célébrations monumentales avec ceux qui font partie de nos vies.<\u002Fp>\n            <p style=\"margin:0\">Merci d'être des nôtres. Votre présence est sans contredit le plus beau des cadeaux et c'est elle qui donnera tout son sens à ce moment qui nous est cher.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ opt1 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:18px;font-size:14.5px;line-height:2;font-weight:300;text-wrap:pretty\">\n            <p style=\"margin:0\">C'est avec le plus grand bonheur que nous vous faisons parvenir cette invitation.<\u002Fp>\n            <p style=\"margin:0\">Nous sommes heureux de pouvoir partager ce moment avec les personnes qui comptent le plus pour nous. Après toutes les aventures, les fous rires, les défis et les projets qui nous ont menés jusqu'ici, nous avons très hâte de célébrer cette nouvelle étape entourée de nos familles et de nos amis.<\u002Fp>\n            <p style=\"margin:0\">Nous avons imaginé cette fin de semaine comme bien plus qu'une journée de mariage. Nous souhaitons créer un moment significatif avec nos proches et de joie où chacun pourra profiter du temps passé ensemble.<\u002Fp>\n            <p style=\"margin:0\">Merci d'être présents pour célébrer avec nous. Votre présence est sans contredit le plus beau des cadeaux.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ opt2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:18px;font-size:14.5px;line-height:2;font-weight:300;text-wrap:pretty\">\n            <p style=\"margin:0\">S'il y a une chose que cette journée représente pour nous, c'est l'importance des liens qui nous unissent aux personnes que nous aimons.<\u002Fp>\n            <p style=\"margin:0\">Lorsque nous avons commencé à imaginer notre mariage, une chose était claire : nous ne voulions pas seulement organiser une belle journée. Nous voulions créer un moment à vivre ensemble. Un moment où le temps ralentit un peu, où les conversations s'étirent, où les rires résonnent plus fort et où l'on peut réellement profiter de la présence des gens qui comptent pour nous.<\u002Fp>\n            <p style=\"margin:0\">C'est donc avec beaucoup d'émotion et de gratitude que nous vous invitons à célébrer cette nouvelle étape de notre vie.<\u002Fp>\n            <p style=\"margin:0\">Votre présence est ce qui donnera tout son sens à cette fin de semaine et nous avons immensément hâte de la partager avec vous.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <p style=\"margin:26px 0 0;font-family:'Caveat',cursive;font-size:34px;color:#495400\">À très bientôt, Frank et Florence<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"programme\" style=\"scroll-margin-top:70px;margin:88px 0 0;padding:76px 24px;background-color:#dadaad;background-image:repeating-linear-gradient(90deg,#cbcf9a 0 1.2px,transparent 1.2px 5px,#cbcf9a 5px 6.2px,transparent 6.2px 22px);position:relative\">\n    <svg sc-camel-view-box=\"0 0 1200 40\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position:absolute;top:0;left:0;width:100%;height:26px;opacity:0.6\" fill=\"none\" stroke=\"#c8cf9f\" stroke-width=\"2\" stroke-linecap=\"round\">\n      <path d=\"M0 20 Q 30 2 60 20 T 120 20 T 180 20 T 240 20 T 300 20 T 360 20 T 420 20 T 480 20 T 540 20 T 600 20 T 660 20 T 720 20 T 780 20 T 840 20 T 900 20 T 960 20 T 1020 20 T 1080 20 T 1140 20 T 1200 20\"><\u002Fpath>\n    <\u002Fsvg>\n    <div style=\"max-width:1020px;margin:0 auto\">\n      <p style=\"margin:0 0 4px;text-align:center;font-family:'Caveat',cursive;font-size:30px;color:#495400\">trois jours ensemble<\u002Fp>\n      <h2 style=\"margin:0 0 46px;font-family:'Cormorant Garamond',serif;font-size:54px;font-weight:300;color:#495400;text-align:center\">Programme<\u002Fh2>\n\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <div style=\"background:#fdfff5;border-radius:22px;padding:38px 36px;display:flex;gap:30px;align-items:flex-start\">\n          <svg sc-camel-view-box=\"0 0 70 70\" style=\"flex:none;width:64px;height:64px\" fill=\"none\" stroke=\"#60941a\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <circle cx=\"35\" cy=\"35\" r=\"33\" fill=\"#eef3da\" stroke=\"#9CA664\" stroke-width=\"1.1\"><\u002Fcircle><circle cx=\"35\" cy=\"35\" r=\"29\" fill=\"none\" stroke=\"#9CA664\" stroke-width=\"0.8\" opacity=\"0.65\"><\u002Fcircle>\n            <g>\n              <path d=\"M20.5 35.5 C25 31.5 30 27 34.8 23.2 C39.8 27 44.8 31.5 49.5 35.2\"><\u002Fpath>\n              <path d=\"M24.8 35.2 C24.4 40 24.6 44.5 25.2 48 C31.8 48.6 38.8 48.6 45.2 48 C45.8 44.2 45.8 39.6 45.4 35\"><\u002Fpath>\n              <path d=\"M31.6 48.2 C31.4 45 31.8 41.8 32.5 39.8 C34.3 39.3 36.2 39.3 37.8 39.7 C38.4 42 38.5 45.2 38.2 48.2\"><\u002Fpath>\n              <path d=\"M34.8 22.4 C34.6 21 34.8 19.6 35.3 19\"><\u002Fpath>\n              <g opacity=\"0.62\" stroke-width=\"1\">\n                <path d=\"M22.5 47.6 C21.4 44.6 21.6 41.6 22.8 39.4\"><\u002Fpath>\n                <path d=\"M22.6 44.4 C20.6 43.8 19.6 41.8 20.2 40 C21.6 40.4 22.6 42.4 22.6 44.4 Z\" fill=\"#dadaad\" fill-opacity=\"0.7\"><\u002Fpath>\n                <path d=\"M22.9 41.4 C24.6 40.4 25.2 38.4 24.4 36.8 C23.2 37.4 22.6 39.4 22.9 41.4 Z\" fill=\"#dadaad\" fill-opacity=\"0.7\"><\u002Fpath>\n                <path d=\"M47.8 47.8 C48.8 44.6 48.4 41.4 47.2 39.2\"><\u002Fpath>\n                <path d=\"M47.6 44.6 C49.6 44 50.6 42 50 40.2 C48.6 40.6 47.6 42.6 47.6 44.6 Z\" fill=\"#dadaad\" fill-opacity=\"0.7\"><\u002Fpath>\n                <path d=\"M47.2 41.6 33.8 44.6 34.6 M48.6 31 C48.8 32.6 48.4 33.8 47.4 34.6\" opacity=\"0.75\" stroke-width=\"0.9\"><\u002Fpath>\n              <path d=\"M43.6 33.6 C44.8 34.6 47.2 34.6 48.4 33.6\" opacity=\"0.7\" stroke-width=\"0.9\"><\u002Fpath>\n              <\u002Fg>\n          <\u002Fsvg>\n          <div style=\"flex:1\">\n            <h3 style=\"margin:0 0 20px;font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:400;color:#495400\">Samedi<\u002Fh3>\n            <div style=\"display:flex;gap:24px;padding:0 0 18px;border-bottom:1px solid #e6e6cf\">\n              <span style=\"min-width:130px;font-family:'Caveat',cursive;font-size:24px;color:#60941a\">matinée<\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <span style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;color:#495400\">Prenez votre temps!<\u002Fspan>\n                <span style=\"font-size:14.5px;line-height:1.9;font-weight:300\">Vous pourrez profiter du confort de votre chalet pour préparer votre déjeuner ou partir à la découverte des cafés et restaurants des environs. Une carte regroupant nos adresses coup de cœur dans la région sera mise à disposition.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:24px;padding:18px 0;border-bottom:1px solid #e6e6cf\">\n              <span style=\"min-width:130px;font-family:'Caveat',cursive;font-size:24px;color:#60941a\">14 h 45 – 15 h<\u002Fspan>\n              <span style=\"font-size:14.5px;line-height:1.9;font-weight:300\">Nous vous invitons à vous diriger vers le lieu de la cérémonie sur le terrain du 2800.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:24px;padding:18px 0 0\">\n              <span style=\"min-width:130px;font-family:'Caveat',cursive;font-size:24px;color:#60941a\">15 h 20<\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14.5px;line-height:1.9;font-weight:300\">\n                <span>Début de la cérémonie.<\u002Fspan>\n                <span>Par la suite, nous aurons un cocktail suivi du repas! Et enfin... une fête mémorable!<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fdfff5;border-radius:22px;padding:38px 36px;display:flex;gap:30px;align-items:flex-start\">\n          <svg sc-camel-view-box=\"0 0 70 70\" style=\"flex:none;width:64px;height:64px\" fill=\"none\" stroke=\"#60941a\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <circle cx=\"35\" cy=\"35\" r=\"33\" fill=\"#eef3da\" stroke=\"#9CA664\" stroke-width=\"1.1\"><\u002Fcircle><circle cx=\"35\" cy=\"35\" r=\"29\" fill=\"none\" stroke=\"#9CA664\" stroke-width=\"0.8\" opacity=\"0.65\"><\u002Fcircle>\n            <g>\n              <path d=\"M23 32 H45 V41 C45 46 41 50 36 50 H32 C27 50 23 46 23 41 Z\"><\u002Fpath>\n              <path d=\"M45 35 H49 C52 35 53 37 53 39 C53 42 51 43 48 43 H45\"><\u002Fpath>\n              <path d=\"M19 54 H51\"><\u002Fpath>\n              <path d=\"M31 27 C29 24 31 22 32 20\" opacity=\"0.6\"><\u002Fpath><path d=\"M38 27 C36 24 38 22 39 20\" opacity=\"0.6\"><\u002Fpath>\n              <g stroke-width=\"1\">\n                <path d=\"M17 47 C15 42 15 37 17 33\" opacity=\"0.7\"><\u002Fpath>\n                <path d=\"M16.5 43 C13 42 12 39 13 37 C15 37 16.5 40 16.5 43 Z\" fill=\"#dadaad\" opacity=\"0.8\"><\u002Fpath>\n                <path d=\"M17 37 C20 36 21.5 33 20.5 31 C18.5 31 17 34 17 37 Z\" fill=\"#dadaad\" opacity=\"0.8\"><\u002Fpath>\n              <\u002Fg>\n            <\u002Fg>\n          <\u002Fsvg>\n          <div style=\"flex:1\">\n            <h3 style=\"margin:0 0 20px;font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:400;color:#495400\">Dimanche<\u002Fh3>\n            <div style=\"display:flex;gap:24px\">\n              <span style=\"min-width:130px;font-family:'Caveat',cursive;font-size:24px;color:#60941a\">10 h 30<\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;gap:12px;font-size:14.5px;line-height:1.9;font-weight:300\">\n                <span>Brunch sur place avec l'ensemble des invités. Nous profiterons d'un dernier moment tous ensemble avant les départs.<\u002Fspan>\n                <span>Puisque le check out des chalets se fait à 11 h, nous vous recommandons de plier bagage, aller donner vos clefs et ensuite vous joindre à nous pour le brunch.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"margin:88px 0 0;padding:70px 24px;background:#eef2df\">\n    <div style=\"max-width:1020px;margin:0 auto;display:flex;gap:34px;align-items:center;justify-content:center;flex-wrap:wrap\">\n      <img src=\"dd9da7f0-5f83-42d9-8d07-6c1a1f04edcb\" alt=\"\" style=\"flex:none;width:130px;height:auto\">\n      <div style=\"position:relative;width:330px;height:410px;flex:none\">\n        <div style=\"position:absolute;inset:34px 40px;border-radius:50%;overflow:hidden\">\n          <image-slot id=\"w2-oval\" shape=\"rect\" src=\"f6840f98-b1f5-4fbe-8b17-514ceef1aaaf\" placeholder=\"Une photo encadrée\" style=\"width:100%;height:100%\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <svg sc-camel-view-box=\"0 0 330 410\" style=\"position:absolute;inset:0;width:100%;height:100%;pointer-events:none\" fill=\"none\" stroke=\"#495400\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n          <path d=\"M165.0 15.0 Q183.9 9.4 200.9 20.5 Q220.7 20.8 234.7 36.8 Q254.2 42.9 264.5 62.8 Q282.5 74.4 288.4 97.1 Q304.0 113.4 305.3 137.6 Q317.4 157.9 313.9 182.1 Q322.0 205.0 313.9 227.9 Q317.4 252.1 305.3 272.4 Q304.0 296.6 288.4 312.9 Q282.5 335.6 264.5 347.2 Q254.2 367.1 234.7 373.2 Q220.7 389.2 200.9 389.5 Q183.9 400.6 165.0 395.0 Q146.1 400.6 129.1 389.5 Q109.3 389.2 664\" stroke-width=\"1.2\"><\u002Fcircle>\n      <circle cx=\"80\" cy=\"80\" r=\"66\" fill=\"none\" stroke=\"#9CA664\" stroke-width=\"0.9\" opacity=\"0.7\"><\u002Fcircle>\n      <g fill=\"none\" stroke=\"#60941a\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n        <path d=\"M80 128 V34\"><\u002Fpath>\n        <path d=\"M80 112 C66 110 58 100 58 88 C70 86 79 96 80 112 Z\"><\u002Fpath>\n        <path d=\"M80 100 C94 98 102 88 102 76 C90 74 81 84 80 100 Z\"><\u002Fpath>\n        <path d=\"M80 84 C66 82 58 72 58 60 C70 58 79 68 80 84 Z\"><\u002Fpath>\n        <path d=\"M80 70 C94 68 102 58 102 46 C90 44 81 54 80 70 Z\"><\u002Fpath>\n        <path d=\"M80 52 C74 44 74 36 78 30 C84 36 86 46 80 52 Z\"><\u002Fpath>\n      <\u002Fg>\n    <\u002Fsvg>\n    <div style=\"flex:1;height:8px;background-image:repeating-linear-gradient(90deg,#9CA664 0 6px,transparent 6px 14px);opacity:0.55\"><\u002Fdiv>\n  <\u002Fdiv>\n  <section id=\"hebergement\" style=\"scroll-margin-top:70px;max-width:1020px;margin:44px auto 0;padding:0 24px\">\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,0.8fr);gap:52px;align-items:start\">\n      <div>\n        <p style=\"margin:0 0 4px;font-family:'Caveat',cursive;font-size:30px;color:#60941a\">dormez avec nous sur place<\u002Fp>\n        <h2 style=\"margin:0 0 24px;font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:300;color:#495400\">Hébergement<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;gap:18px;font-size:14.5px;line-height:2;font-weight:300;text-wrap:pretty\">\n          <p style=\"margin:0\">Nous coordonnerons l'hébergement de tous les invités qui séjourneront sur place.<\u002Fp>\n          <p style=\"margin:0\">Étant donné l'emplacement du mariage, nous vous demandons de considérer sérieusement l'option de dormir sur place. Notre souhait est que chacun puisse profiter pleinement des célébrations et retourner à son hébergement en toute sécurité.<\u002Fp>\n          <p style=\"margin:0\">Afin de faciliter l'organisation, nous avons choisi un site capable d'accueillir confortablement l'ensemble de nos invités et dans des frais raisonnables. Le domaine se situe à environ deux heures de Montréal et offre plusieurs mini-chalets répartis sur le terrain.<\u002Fp>\n          <p style=\"margin:0\">Les propriétaires nous ont demandé de coordonner l'ensemble des réservations. Nous avancerons donc les frais et procéderons à l'attribution des hébergements avant l'événement. Nous pourrons vous indiquer clairement le montant associé à votre hébergement.<\u002Fp>\n          <p style=\"margin:0\">Veuillez noter que nous avons fait d'amples recherches et avons constaté que les établissements de la région exigent une réservation minimale de deux nuits pour une multitude de raisons.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <svg sc-camel-view-box=\"0 0 240 180\" style=\"width:100%;height:auto;margin-bottom:14px\" fill=\"none\" stroke=\"#9CA664\" stroke-width=\"1.3\" stroke-linecap=\"round\">\n          <path d=\"M40 108 L76 72 L112 108 M48 108 V150 H104 V108\"><\u002Fpath>\n          <path d=\"M68 150 V126 H86 V150 M76 84 V96\"><\u002Fpath>\n          <path d=\"M132 120 L160 92 L188 120 M138 120 V150 H182 V120\"><\u002Fpath>\n          <path d=\"M154 150 V132 H168 V150\"><\u002Fpath>\n          <path d=\"M14 150 H226\"><\u002Fpath>\n          <g stroke-width=\"1.1\"><circle cx=\"204\" cy=\"128\" r=\"7\"><\u002Fcircle><circle cx=\"214\" cy=\"120\" r=\"7\"><\u002Fcircle><circle cx=\"222\" cy=\"130\" r=\"7\"><\u002Fcircle><path d=\"M212 138 C212 144 208 148 204 150\"><\u002Fpath><\u002Fg>\n          <g stroke-width=\"1.1\"><path d=\"M24 150 C24 132 32 120 40 116 M32 132 C26 128 24 122 24 116\"><\u002Fpath><\u002Fg>\n        <\u002Fsvg>\n        <div style=\"position:relative;width:300px;height:300px;margin:0 auto\">\n          <div style=\"position:absolute;inset:34px;border-radius:50%;overflow:hidden\">\n \"><\u002Fpath><path d=\"M45 20 V10 H50 V25\"><\u002Fpath><\u002Fsvg>\n        <h3 style=\"margin:0 0 16px;font-family:'Caveat',cursive;font-size:38px;font-weight:600;color:#495400\">Hébergement<\u002Fh3>\n        <div style=\"display:flex;flex-direction:column;gap:12px;font-size:11px;line-height:2;letter-spacing:0.1em;text-transform:uppercase;color:#4f5533\"><p style=\"margin:0\">Mini-chalets répartis sur le terrain du domaine, à environ deux heures de Montréal.<\u002Fp><p style=\"margin:0\">Nous coordonnons les réservations et avançons les frais.<\u002Fp><p style=\"margin:0\">Minimum deux nuits, exigé par les établissements de la région.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative;flex:1;min-width:250px;max-width:310px;padding:52px 34px 40px;text-align:center\">\n        <svg sc-camel-view-box=\"0 0 300 420\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position:absolute;inset:0;width:100%;height:100%;pointer-events:none\" fill=\"none\" stroke=\"#495400\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\">\n          <path vector-effect=\"non-scaling-stroke\" d=\"M150 10 C210 8 262 12 282 22 C292 40 296 90 294 150 C296 230 292 340 284 396 C240 410 180 412 150 410 C112 412 58 410 18 398 C8 340 4 250 6 160 C4 92 8 40 18 22 C60 10 108 12 150 10 Z\"><\u002Fpath>\n          <path vector-effect=\"non-scaling-stroke\" d=\"M150 18 C204 16 252 20 272 28 C280 46 284 92 282 150 C284 226 280 332 274 386 C234 398 178 400 150 398 C116 400 64 398 26 388 C16 332 12 248 14 160 C12 94 16 46 26 28 C64 18 110 20 150 18\" stroke-width=\"1\" opacity=\"0.55\"><\u002Fpath>\n          \n        <\u002Fsvg>\n        <svg sc-camel-view-box=\"0 0 90 46\" style=\"position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:78px;height:40px\" fill=\"none\" stroke=\"#495400\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n          <path d=\"M45 24 C32 10 18 10 16 20 tty\">\n          <p style=\"margin:0\">C'est probablement la question qu'on nous pose le plus souvent!<\u002Fp>\n          <p style=\"margin:0\">C'est une célébration, alors nous vous invitons à vous mettre sur votre 31, à porter de la couleur, à exprimer votre personnalité et à vous sentir magnifiques.<\u002Fp>\n          <p style=\"margin:0\">Robes colorées, complets audacieux, textures, motifs, accessoires : tout est bienvenu!<\u002Fp>\n          <p style=\"margin:0\">Nous vous demandons simplement d'éviter le blanc ainsi que les teintes très près du blanc afin de laisser ce privilège à la mariée.<\u002Fp>\n          <div style=\"position:relative;margin-top:8px;padding:44px 28px 30px;text-align:center\">\n            <svg sc-camel-view-box=\"0 0 300 420\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position:absolute;inset:0;width:100%;height:100%;pointer-events:none\" fill=\"none\" stroke=\"#495400\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\">\n          <path vector-effect=\"non-scaling-stroke\" d=\"M150 10 C210 8 262 12 282 22 C292 40 296 90 294 150 C296 230 292 340 284 396 C240 410 180 412 150 410 C112 412 58 410 18 398 C8 340 4 250 6 160 C4 92 8 40 18 22 C60 10 108 12 150 10 Z\"><\u002Fpath>\n          <path vector-effect=\"non-scaling-stroke\" d=\"M150 18 C204 16 252 20 272 28 C280 46 284 92 282 150 C284 226 280 332 274 386 C234 398 178 400 150 398 C116 400 64 398 26 388 C16 332 12 248 14 160 C12 94 16 46 26 28 C64 18 110 20 150 18\" stroke-width=\"1\" opacity=\"0.55\"><\u002Fpath>\n          \n        <\u002Fsvg>\n            <svg sc-camel-view-box=\"0 0 90 46\" style=\"position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:78px;height:40px\" fill=\"none\" stroke=\"#495400\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n          <path d=\"M45 24 C32 10 18 10 16 20 C14 30 30 32 45 24 Z\"><\u002Fpath>\n          <path d=\"M45 24 C58 10 72 10 74 20 C76 30 60 32 45 24 Z\"><\u002Fpath>\n          <path d=\"M45 24 C41 32 38 40 34 44 M45 24 C49 32 52 40 56 44\"><\u002Fpath>\n        <\u002Fsvg>\n            <p style=\"margin:0;font-family:'Caveat',cursive;font-size:34px;color:#495400;line-height:1.3\">L'objectif : une foule élégante, festive et pleine de couleur.<\u002Fp>\n            <p style=\"margin:12px 0 0;font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#4f5533;line-height:1.9\">Évitez le blanc et les teintes très près du blanc<\u002Fp>\n          <\u002Fdiv>\n          \n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start\">\n          <image-slot id=\"w2-mood-1\" shape=\"rounded\" radius=\"14\" src=\"68435ce5-8583-43cc-b646-043eeeab0e4c\" placeholder=\"Moodboard robes\" style=\"width:100%;aspect-ratio:1152 / 2048\"><\u002Fimage-slot>\n          <image-slot id=\"w2-mood-2\" shape=\"rounded\" radius=\"14\" src=\"335a0433-7abb-4438-8aa7-08b412ce9526\" placeholder=\"Moodboard garden chic\" style=\"width:100%;aspect-ratio:1152 / 2048\"><\u002Fimage-slot>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"max-width:1020px;margin:64px auto 0;padding:0 24px;display:flex;align-items:center;gap:18px\">\n    <div style=\"flex:1;height:8px;background-image:repeating-linear-gradient(90deg,#9CA664 0 6px,transparent 6px 14px);opacity:0.55\"><\u002Fdiv>\n    <svg sc-camel-view-box=\"0 0 160 160\" style=\"flex:none;width:86px;height:86px\">\n      <circle cx=\"80\" cy=\"80\" r=\"74\" fill=\"#f2f5e4\" stroke=\"#9CA664\" stroke-width=\"1.2\"><\u002Fcircle>\n      <circle cx=\"80\" cy=\"80\" r=\"66\" fill=\"none\" stroke=\"#9CA664\" stroke-width=\"0.9\" opacity=\"0.7\"><\u002Fcircle>\n      <g fill=\"none\" stroke=\"#60941a\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n        <path d=\"M80 128 V34\"><\u002Fpath>\n        <path d=\"M80 112 C66 110 58 100 58 88 C70 86 79 96 80 112 Z\"><\u002Fpath>\n        <path d=\"M80 100 C94 98 102 88 102 76 C90 74 81 84 80 100 Z\"><\u002Fpath>\n        <path d=\"M80 84 C66 82 58 72 58 60 C70 58 79 68 80 84 Z\"><\u002Fpath>\n        <path d=\"M80 70 C94 68 102 58 102 46 C90 44 81 54 80 70 Z\"><\u002Fpath>\n        <path d=\"M80 52 C74 44 74 36 78 30 C84 36 86 46 80 52 Z\"><\u002Fpath>\n      <\u002Fg>\n    <\u002Fsvg>\n    <div style=\"flex:1;height:8px;background-image:repeating-linear-gradient(90deg,#9CA664 0 6px,transparent 6px 14px);opacity:0.55\"><\u002Fdiv>\n  <\u002Fdiv>\n  <section id=\"cadeaux\" style=\"scroll-margin-top:70px;margin:44px 0 0;padding:72px 24px 78px;background:#eef2df\">\n    <div style=\"max-width:680px;margin:0 auto;text-align:center\">\n      \n      <h2 style=\"margin:0 0 6px;font-family:'Caveat',cursive;font-size:76px;font-weight:600;line-height:1;color:#495400\">Cadeaux de mariage<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:16px;margin-top:22px;font-size:13.5px;line-height:2;font-weight:300;letter-spacing:0.02em;text-wrap:pretty\">\n        <p style=\"margin:0\">Votre présence à nos côtés lors de cette fin de semaine est sincèrement le plus beau cadeau que vous puissiez nous offrir.<\u002Fp>\n        <p style=\"margin:0\">Cependant, plusieurs d'entre vous nous ont demandé s'il était possible de contribuer à cette célébration. Si vous souhaitez nous offrir un cadeau, une contribution en argent sera ce qui nous sera le plus utile au moment où nous amorçons ce nouveau chapitre ensemble.<\u002Fp>\n      <\u002Fdiv>\n      \n      <svg sc-camel-view-box=\"0 0 180 130\" style=\"width:168px;height:122px;margin:32px auto 0;display:block;opacity:0.9\" fill=\"none\" stroke=\"#9CA664\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n        <ellipse cx=\"90\" cy=\"98\" rx=\"62\" ry=\"12\"><\u002Fellipse>\n        <path d=\"M28 98 C32 112 52 120 90 120 C128 120 148 112 152 98\"><\u002Fpath>\n        <path d=\"M80 96 V72 M100 96 V72\"><\u002Fpath>\n        <ellipse cx=\"90\" cy=\"70\" rx=\"30\" ry=\"8\"><\u002Fellipse>\n        <path d=\"M60 70 C64 80 74 84 90 84 C106 84 116 80 120 70\"><\u002Fpath>\n        <path d=\"M88 62 V40 M92 62 V40\"><\u002Fpath>\n        <ellipse cx=\"90\" cy=\"38\" rx=\"14\" ry=\"5\"><\u002Fellipse>\n        <path d=\"M90 32 V18\"><\u002Fpath>\n        <path d=\"M90 20 C78 26 70 38 68 52\"><\u002Fpath>\n        <path d=\"M90 20 C102 26 110 38 112 52\"><\u002Fpath>\n      <\u002Fsvg>\n    \n  <\u002Fdiv><\u002Fsection>\n  <div style=\"max-width:1020px;margin:64px auto 0;padding:0 24px;display:flex;align-items:center;gap:18px\">\n    <div style=\"flex:1;height:8px;background-image:repeating-linear-gradient(90deg,#9CA664 0 6px,transparent 6px 14px);opacity:0.55\"><\u002Fdiv>\n    <svg sc-camel-view-box=\"0 0 160 160\" style=\"flex:none;width:86px;height:86px\">\n      <circle cx=\"80\" cy=\"80\" r=\"74\" fill=\"#f2f5e4\" stroke=\"#9CA664\" stroke-width=\"1.2\"><\u002Fcircle>\n      <circle cx=\"80\" cy=\"80\" r=\"66\" fill=\"none\" stroke=\"#9CA664\" stroke-width=\"0.9\" opacity=\"0.7\"><\u002Fcircle>\n      <g fill=\"none\" stroke=\"#60941a\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n        <path d=\"M80 128 V34\"><\u002Fpath>\n        <path d=\"M80 112 C66 110 58 100 58 88 C70 86 79 96 80 112 Z\"><\u002Fpath>\n        <path d=\"M80 100 C94 98 102 88 102 76 C90 74 81 84 80 100 Z\"><\u002Fpath>\n        <path d=\"M80 84 C66 82 58 72 58 60 C70 58 79 68 80 84 Z\"><\u002Fpath>\n        <path d=\"M80 70 C94 68 102 58 102 46 C90 44 81 54 80 70 Z\"><\u002Fpath>\n        <path d=\"M80 52 C74 44 74 36 78 30 C84 36 86 46 80 52 Z\"><\u002Fpath>\n      <\u002Fg>\n    <\u002Fsvg>\n    <div style=\"flex:1;height:8px;background-image:repeating-linear-gradient(90deg,#9CA664 0 6px,transparent 6px 14px);opacity:0.55\"><\u002Fdiv>\n  <\u002Fdiv>\n  <section id=\"faq\" style=\"scroll-margin-top:70px;margin:44px 0 0;padding:64px 24px 70px;background-color:#fdfff5;background-image:radial-gradient(#dfe6c4 2.2px, transparent 2.4px);background-size:26px 26px\">\n    <div style=\"max-width:800px;margin:0 auto\">\n    <p style=\"margin:0 0 4px;text-align:center;font-family:'Caveat',cursive;font-size:30px;color:#60941a\">vous vous demandez peut-être...<\u002Fp>\n    <h2 style=\"margin:0 0 32px;font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:300;color:#495400;text-align:center\">Questions fréquentes<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <details style=\"background:#fdfff5;border:1px solid #e4e9cd;border-radius:16px;padding:20px 24px\">\n        <summary style=\"font-size:15px;color:#495400;font-weight:500\">Puis-je amener un invité?<\u002Fsummary>\n        <p style=\"margin:14px 0 0;font-size:14px;line-height:2;font-weight:300\">Chaque invitation indique les personnes invitées. Afin de nous aider dans l'organisation de l'événement et de l'hébergement, nous vous demandons de respecter les noms figurant sur votre invitation.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"background:#fdfff5;border:1px solid #e4e9cd;border-radius:16px;padding:20px 24px\">\n        <summary style=\"font-size:15px;color:#495400;font-weight:500\">Que faire en cas de pluie?<\u002Fsummary>\n        <p style=\"margin:14px 0 0;font-size:14px;line-height:2;font-weight:300\">Si la météo ne permet pas de tenir la cérémonie à l'endroit prévu, nous vous confirmerons le lieu de remplacement avant l'événement. La réception aura lieu comme prévu, peu importe la météo.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"background:#fdfff5;border:1px solid #e4e9cd;border-radius:16px;padding:20px 24px\">\n        <summary style=\"font-size:15px;color:#495400;font-weight:500\">Y aura-t-il un brunch le lendemain?<\u002Fsummary>\n        <p style=\"margin:14px 0 0;font-size:14px;line-height:2;font-weight:300\">Oui! Nous vous invitons à nous rejoindre au 2800 pour un brunch à 10 h 30 afin de partager un dernier moment tous ensemble avant les départs.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"background:#fdfff5;border:1px solid #e4e9cd;border-radius:16px;padding:20px 24px\">\n        <summary style=\"font-size:15px;color:#495400;font-weight:500\">Devrais-je dormir sur place?<\u002Fsummary>\n        <p style=\"margin:14px 0 0;font-size:14px;line-height:2;font-weight:300\">Nous le recommandons fortement. Le site a été choisi précisément pour permettre à tous de profiter de la soirée en toute sécurité et sans avoir à reprendre la route après les festivités.<\u002Fp>\n      <\u002Fdetails>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"rsvp\" style=\"scroll-margin-top:70px;margin:88px 0 0;padding:76px 24px 90px;background-color:#dadaad;background-image:repeating-conic-gradient(from 45deg at 50% 50%, #d1d49f 0deg 90deg, #dadaad 90deg 180deg);background-size:34px 34px\">\n    <div style=\"max-width:700px;margin:0 auto;background:#fdfff5;border-radius:26px;padding:52px 46px\">\n      <svg sc-camel-view-box=\"0 0 200 60\" style=\"width:180px;height:56px;margin:0 auto 8px;display:block;opacity:0.8\" fill=\"none\" stroke=\"#9CA664\" stroke-width=\"1.2\" stroke-linecap=\"round\">\n        <path d=\"M60 20 H140 V50 H60 Z M60 20 L100 42 L140 20\"><\u002Fpath>\n        <g><circle cx=\"36\" cy=\"24\" r=\"7\"><\u002Fcircle><circle cx=\"26\" cy=\"16\" r=\"7\"><\u002Fcircle><circle cx=\"18\" cy=\"26\" r=\"7\"><\u002Fcircle><path d=\"M28 34 C28 42 34 48 42 50\"><\u002Fpath><\u002Fg>\n        <g><circle cx=\"164\" cy=\"24\" r=\"7\"><\u002Fcircle><circle cx=\"174\" cy=\"16\" r=\"7\"><\u002Fcircle><circle cx=\"182\" cy=\"26\" r=\"7\"><\u002Fcircle><path d=\"M172 34 C172 42 166 48 158 50\"><\u002Fpath><\u002Fg>\n      <\u002Fsvg>\n      <div style=\"display:flex;align-items:center;justify-content:center;gap:22px\">\n        <img src=\"1a52aba6-4bda-4775-883f-7785bc332430\" alt=\"\" style=\"flex:none;width:38px;height:auto;opacity:0.85\">\n        <h2 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-size:56px;font-weight:300;color:#495400;text-align:center\">RSVP<\u002Fh2>\n        <img src=\"24715160-9644-492f-9290-145036833759\" alt=\"\" style=\"flex:none;width:38px;height:auto;opacity:0.85\">\n      <\u002Fdiv>\n      <p style=\"margin:0 0 26px;text-align:center;font-family:'Caveat',cursive;font-size:28px;color:#60941a\">avant le 1<sup>er<\u002Fsup> décembre 2026<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:34px;font-size:14.5px;line-height:2;font-weight:300;text-align:center\">\n        <p style=\"margin:0\">Merci de confirmer votre présence le plus rapidement qu'il vous sera possible.<\u002Fp>\n        <p style=\"margin:0\">Nous avons hâte de savoir que vous serez des nôtres et de commencer à organiser cette merveilleuse fin de semaine avec vous.<\u002Fp>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ envoye }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:48px 20px;text-align:center;background:#f5f7e6;border-radius:20px\">\n          <p style=\"margin:0;font-family:'Caveat',cursive;font-size:44px;color:#495400\">Merci, c'est noté!<\u002Fp>\n          <p style=\"margin:10px 0 0;font-size:14px;font-weight:300\">Nous revenons vers vous très bientôt.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ pasEnvoye }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:24px\">\n          <div>\n            <label style=\"display:block;margin-bottom:9px;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:#60941a;font-weight:600\">Nom et prénom *<\u002Flabel>\n            <input type=\"text\" value=\"{{ nom }}\" sc-camel-on-change=\"{{ setNom }}\" placeholder=\"Votre nom complet\" style=\"width:100%;padding:13px 15px;border:1px solid #9CA664;border-radius:12px;background:#fff;font-size:14px;color:#3f4526\">\n            <p style=\"margin:8px 0 0;font-family:'Caveat',cursive;font-size:20px;color:#9CA664\">un formulaire par personne, même pour les couples<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin:0 0 10px;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:#60941a;font-weight:600\">Serez-vous des nôtres? *<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <label style=\"display:flex;gap:12px;align-items:center;padding:13px 15px;border:1px solid #9CA664;border-radius:12px;background:#fff;font-size:14px;cursor:pointer\" style-hover=\"background:#f5f7e6\">\n                <input type=\"radio\" name=\"presence2\" checked=\"{{ presenceOui }}\" sc-camel-on-change=\"{{ setOui }}\" style=\"accent-color:#495400\">\n                <span>Je serai présent(e) avec plaisir<\u002Fspan>\n              <\u002Flabel>\n              <label style=\"display:flex;gap:12px;align-items:center;padding:13px 15px;border:1px solid #9CA664;border-radius:12px;background:#fff;font-size:14px;cursor:pointer\" style-hover=\"background:#f5f7e6\">\n                <input type=\"radio\" name=\"presence2\" checked=\"{{ presenceNon }}\" sc-camel-on-change=\"{{ setNon }}\" style=\"accent-color:#495400\">\n                <span>Je ne pourrai malheureusement pas être présent(e)<\u002Fspan>\n              <\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin:0 0 10px;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:#60941a;font-weight:600\">Hébergement<\u002Fp>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <label style=\"flex:1;min-width:210px;display:flex;gap:12px;align-items:center;padding:13px 15px;border:1px solid #9CA664;border-radius:12px;background:#fff;font-size:14px;cursor:pointer\" style-hover=\"background:#f5f7e6\">\n                <input type=\"radio\" name=\"dodo2\" style=\"accent-color:#495400\">\n                <span>Nous dormirons sur place<\u002Fspan>\n              <\u002Flabel>\n              <label style=\"flex:1;min-width:210px;display:flex;gap:12px;align-items:center;padding:13px 15px;border:1px solid #9CA664;border-radius:12px;background:#fff;font-size:14px;cursor:pointer\" style-hover=\"background:#f5f7e6\">\n                <input type=\"radio\" name=\"dodo2\" style=\"accent-color:#495400\">\n                <span>Nous ne dormirons pas sur place<\u002Fspan>\n              <\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <label style=\"display:flex;gap:12px;align-items:center;padding:13px 15px;border:1px solid #9CA664;border-radius:12px;background:#fff;font-size:14px;cursor:pointer\" style-hover=\"background:#f5f7e6\">\n            <input type=\"checkbox\" style=\"accent-color:#495400\">\n            <span>Je serai présent(e) le vendredi soir à l'Olivia<\u002Fspan>\n          <\u002Flabel>\n          <div>\n            <label style=\"display:block;margin-bottom:9px;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:#60941a;font-weight:600\">Restrictions alimentaires<\u002Flabel>\n            <input type=\"text\" placeholder=\"Allergies, régime particulier…\" style=\"width:100%;padding:13px 15px;border:1px solid #9CA664;border-radius:12px;background:#fff;font-size:14px;color:#3f4526\">\n          <\u002Fdiv>\n          <div>\n            <label style=\"display:block;margin-bottom:9px;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:#60941a;font-weight:600\">Vos chansons incontournables<\u002Flabel>\n            <textarea rows=\"3\" placeholder=\"Pour danser toute la soirée\" style=\"width:100%;padding:13px 15px;border:1px solid #9CA664;border-radius:12px;background:#fff;font-size:14px;color:#3f4526;resize:vertical\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ envoyer }}\" style=\"padding:15px 20px;border:none;border-radius:999px;background:#495400;color:#fdfff5;font-family:'Raleway',sans-serif;font-size:10.5px;letter-spacing:0.24em;text-transform:uppercase;font-weight:600;cursor:pointer\" style-hover=\"background:#60941a\">Envoyer ma réponse<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"padding:56px 24px 66px;text-align:center;background:#eef2df;color:#495400\">\n    \n    <p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:300\">Frank <span style=\"font-style:italic;color:#9CA664\">&amp;<\u002Fspan> Florence<\u002Fp>\n    <p style=\"margin:12px 0 0;font-family:'Caveat',cursive;font-size:24px;color:#60941a\">{{ dateLieu }}<\u002Fp>\n    <img src=\"e18159bc-c184-4101-a50f-b8fdca54d6f6\" alt=\"\" style=\"width:96px;height:auto;margin:14px auto 0;display:block\">\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;motBienvenue&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Option 1&quot;,&quot;Option 2&quot;,&quot;Option 3&quot;],&quot;default&quot;:&quot;Option 3&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contenu&quot;},&quot;dateLieu&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Samedi 7 août 2027 · Le 2800, à deux heures de Montréal&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contenu&quot;}}\">\nclass Component extends DCLogic {\n  state = { nom: \"\", presence: \"oui\", envoye: false };\n  renderVals() {\n    const mot = this.props.motBienvenue ?? \"Option 3\";\n    return {\n      dateLieu: this.props.dateLieu ?? \"\\nSamedi 7 août 2027 · Le 2800, à deux heures de Montréal\",\n      opt1: mot === \"Option 1\",\n      opt2: mot === \"Option 2\",\n      opt3: mot === \"Option 3\",\n      nom: this.state.nom,\n      setNom: (e) => this.setState({ nom: e.target.value }),\n      presenceOui: this.state.presence === \"oui\",\n      presenceNon: this.state.presence === \"non\",\n      setOui: () => this.setState({ presence: \"oui\" }),\n      setNon: () => this.setState({ presence: \"non\" }),\n      envoye: this.state.envoye,\n      pasEnvoye: !this.state.envoye,\n      envoyer: () => this.setState({ envoye: true }),\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
